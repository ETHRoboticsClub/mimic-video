data_transforms:
  - name: CosmosProcessImage
    targets: [workspace_rgb]
    resize_sizes: ${policy_io.img_resize_sizes}

  # Convert absolute action targets into deltas relative to the last observed
  # joint state. Forces inter-chunk continuity at deployment (predictions start
  # at zero delta = exact current pose) and shrinks the diffusion target range.
  - name: SubtractObsReference
    targets: ["action/joint_action_lowdim"]
    additional_data:
      reference: obs/joint_state_lowdim

  - name: Concat
    targets: ${policy_io.concat_groups.action/lowdim_concat}
    out_key: "action/lowdim_concat"
  - name: Concat
    targets: ${policy_io.concat_groups.obs/lowdim_concat}
    out_key: "obs/lowdim_concat"

source_component_names: {}

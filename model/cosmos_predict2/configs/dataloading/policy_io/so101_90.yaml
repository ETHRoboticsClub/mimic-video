img_resize_sizes: [480, 640]

# 90-action variant of policy_io/so101_long.yaml. Backbone window is the full
# state_t=16 latents (5 obs + 56 future video frames at 10 Hz = 6.1 s). The
# action stream predicts 90 lowdim actions at 30 Hz = 3.0 s of future control,
# which is a subset (first half) of the 6.1 s video conditioning window.
policy_io:
  action:
    workspace_rgb:
      horizon: 56
      normalization_type: ${NormalizationType:NONE}
      target_repr: null
      target_frequency: 10
      shift_right_by: 0.1
    joint_action_lowdim:
      # 90 future actions at 30 Hz = 3.0 s lookahead.
      horizon: 90
      normalization_type: ${NormalizationType:VARIANCE}
      target_repr: ${LieRepr:ABSOLUTE}
      target_frequency: 30
      shift_right_by: 0
  obs:
    workspace_rgb:
      horizon: 5
      normalization_type: ${NormalizationType:NONE}
      target_repr: null
      target_frequency: 10
      shift_right_by: 0
    joint_state_lowdim:
      horizon: 1
      normalization_type: ${NormalizationType:VARIANCE}
      target_repr: ${LieRepr:ABSOLUTE}
      target_frequency: 30
      shift_right_by: 0
    language_embedding:
      horizon: 1
      normalization_type: ${NormalizationType:NONE}
      target_repr: null
      target_frequency: null
      shift_right_by: 0

concat_groups:
  action/lowdim_concat:
    - action/joint_action_lowdim

  obs/lowdim_concat:
    - obs/joint_state_lowdim

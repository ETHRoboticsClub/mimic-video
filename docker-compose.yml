version: '3.8'

services:
  mimic-video-inference:
    image: nvcr.io/nvidia/cosmos/cosmos-predict2-container:1.1
    container_name: mimic-video-inference
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # Mount local code and data
    volumes:
      # Mount the model directory for access to inference scripts
      - ./model:/workspace/mimic-video/model:ro
      # Mount checkpoints directory (create this directory and download checkpoints there)
      - ./checkpoints:/workspace/checkpoints:ro
      # Mount output directory for generated videos
      - ./output:/workspace/output
      # Mount data directory for input videos/images
      - ./data:/workspace/data:ro
    
    # Working directory inside container
    working_dir: /workspace/mimic-video/model
    
    # Environment variables
    environment:
      # Hugging Face token for downloading models (optional, set via .env file)
      - HF_TOKEN=${HF_TOKEN:-}
      # Python settings
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace/mimic-video/model
      # Disable distributed training for single GPU inference
      - TORCH_DISTRIBUTED_DEBUG=DETAIL
      # Optional: Set specific GPU
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    
    # Interactive mode for CLI usage
    stdin_open: true
    tty: true
    
    # Default command - can be overridden at runtime
    command: >
      bash -c "
        echo 'mimic-video inference container ready.'
        echo 'Run inference with:'
        echo '  python scripts/run_video2world.py --help'
        echo ''
        echo 'Example:'
        echo '  python scripts/run_video2world.py \\'
        echo '    --dit_path /workspace/checkpoints/v2w_pretrained_cosmos \\'
        echo '    --prompt \"robot arm picks up the block\" \\'
        echo '    --input_path /workspace/data/input.mp4 \\'
        echo '    --save_path /workspace/output/generated.mp4'
        echo ''
        tail -f /dev/null
      "

# Example .env file variables (create .env.local and reference it):
# HF_TOKEN=your_huggingface_token_here
# CUDA_VISIBLE_DEVICES=0
